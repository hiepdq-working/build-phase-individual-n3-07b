# Bộ truy vấn — commit file này TRƯỚC khi chạy đo (OI-24, NFR-04).
# Sau khi đã thấy kết quả: không sửa câu, không thêm/bớt câu.
#
#   tool:       3–5 câu mô tả lát cắt hiếm, dùng để chọn arm_tool (Bước 5). Không xem kết quả trên val.
